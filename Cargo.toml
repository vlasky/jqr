[package]
name = "jqr"
version = "0.1.0"
edition = "2024"
description = "jq for broken JSON - repairs truncated/mangled JSON before querying"
license = "MIT"

[dependencies]
serde_json = { version = "1", features = ["unbounded_depth"] }
serde = "1"
serde_stacker = "0.1"
jsonrepair-rs = "0.2"

[profile.release]
lto = true
strip = true
